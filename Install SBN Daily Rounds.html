<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Install SBN Daily Rounds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:400px;width:100%;text-align:center;background:#112240;border:2px solid #ff9900;border-radius:20px;padding:32px 24px;box-shadow:0 12px 40px rgba(255,153,0,0.2)}
.icon{font-size:56px;margin-bottom:12px}
h1{font-size:22px;color:#ff9900;margin-bottom:4px}
.sub{font-size:14px;color:#94a3b8;margin-bottom:24px}
.install-btn{display:block;width:100%;padding:18px;background:#ff9900;color:#0a1628;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer;margin-bottom:12px;min-height:60px;text-decoration:none;transition:all .15s}
.install-btn:hover{opacity:.9;transform:scale(1.01)}
.install-btn:active{transform:scale(0.97)}
.note{font-size:12px;color:#64748b;line-height:1.5;margin-top:16px}
.status{font-size:13px;margin-top:16px;padding:10px;border-radius:8px}
.status.ok{background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.3)}
.status.wait{background:rgba(245,158,11,0.1);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #f59e0b;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<div class="icon">🔧</div>
<h1>SBN Daily Rounds</h1>
<div class="sub">DCEO Building Walkthrough App</div>
<a class="install-btn" id="installBtn" href="https://jeffreyswick8.github.io/sbn-daily-rounds/" target="_blank">📲 TAP TO INSTALL</a>
<div class="status wait" id="status"><span class="spinner"></span>Waiting for tap...</div>
<div class="note">
This will open Chrome and load the app.<br>
Then tap <b>⋮</b> (menu) → <b>"Install app"</b> to add it to the home screen.
</div>
</div>
<script>
var btn = document.getElementById('installBtn');
var status = document.getElementById('status');
btn.addEventListener('click', function(){
  status.className = 'status ok';
  status.innerHTML = '✅ Opening app in Chrome — follow the install steps!';
});
</script>
</body>
</html>
