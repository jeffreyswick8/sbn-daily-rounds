<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer>
/* ===== CAMERA FOR WINDOWS TABLETS ===== */
var cameraStream = null;
var camSIdx = -1;
var camIIdx = -1;
var camFacing = 'environment'; // Default to back camera

function startCameraStream() {
  // Stop any existing stream first
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(track) { track.stop(); });
    cameraStream = null;
  }
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: {exact: camFacing}, width: {ideal: 1280}, height: {ideal: 720} }
  }).catch(function() {
    // exact facingMode failed — try ideal (some devices don't support exact)
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: {ideal: camFacing}, width: {ideal: 1280}, height: {ideal: 720} }
    });
  }).then(function(stream) {
    cameraStream = stream;
    var video = document.getElementById('cameraVideo');
    video.srcObject = stream;
    video.onloadedmetadata = function() { video.play(); };
    return stream;
  });
}

function openCamera(sIdx, iIdx) {
  camSIdx = sIdx;
  camIIdx = iIdx;
  camFacing = 'environment'; // Always start with back camera
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    startCameraStream().then(function() {
      document.getElementById('cameraModal').style.display = 'flex';
    }).catch(function(err) {
      // Camera denied or not available — fall back to file picker
      var inp = document.getElementById('fileInp-' + sIdx + '-' + iIdx);
      if (inp) inp.click();
    });
  } else {
    var inp = document.getElementById('fileInp-' + sIdx + '-' + iIdx);
    if (inp) inp.click();
  }
}

function flipCamera() {
  camFacing = (camFacing === 'environment') ? 'user' : 'environment';
  startCameraStream().catch(function() {
    // If flip fails, revert
    camFacing = (camFacing === 'environment') ? 'user' : 'environment';
    startCameraStream();
  });
}

function capturePhoto() {
  var video = document.getElementById('cameraVideo');
  var canvas = document.getElementById('cameraCanvas');
  var maxW = 800;
  var w = video.videoWidth;
  var h = video.videoHeight;
  if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  var compressed = canvas.toDataURL('image/jpeg', 0.8);
  var key = camSIdx + '-' + camIIdx;
  if (!photoStore[key]) photoStore[key] = [];
  if (photoStore[key].length < 3) {
    photoStore[key].push(compressed);
    roundData.sections[camSIdx].items[camIIdx].photos = photoStore[key].length;
    renderWalkthrough();
    syncToFirebase();
  }
  closeCameraModal();
}

function closeCameraModal() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(track) { track.stop(); });
    cameraStream = null;
  }
  var video = document.getElementById('cameraVideo');
  video.srcObject = null;
  document.getElementById('cameraModal').style.display = 'none';
}

// Wire up camera modal buttons (using addEventListener to avoid inline onclick issues)
document.getElementById('btnCapture').addEventListener('click', capturePhoto);
document.getElementById('btnCamCancel').addEventListener('click', closeCameraModal);
document.getElementById('btnFlipCam').addEventListener('click', flipCamera);

</script>

<style>
:root{--bg:#1a2332;--surface:#232f3e;--card:#2d3a4a;--accent:#ff9900;--accent-dk:#cc7a00;--green:#22c55e;--red:#ef4444;--text:#f5f5f5;--muted:#94a3b8;--border:#374151;--radius:12px}
body.light-mode{--bg:#f0f2f5;--surface:#ffffff;--card:#e8ecf1;--text:#1a1a1a;--muted:#64748b;--border:#d1d5db}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:768px;margin:0 auto}
.header{background:var(--surface);padding:12px 16px;border-bottom:2px solid var(--accent);text-align:center;flex-shrink:0;position:relative}
.header h1{font-size:18px;color:var(--accent);font-weight:700}
.header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.mode-btn{position:absolute;right:12px;top:12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}
body.light-mode .mode-btn{background:rgba(0,0,0,0.08);color:#1a1a1a;border-color:rgba(0,0,0,0.15)}
.screen{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column}
.screen.active{display:flex}
.content{flex:1;overflow-y:auto;padding:12px}
.warning-banner{background:#7f1d1d;color:#fca5a5;padding:10px;border-radius:var(--radius);font-size:11px;font-weight:600;text-align:center;margin-bottom:16px}
body.light-mode .warning-banner{background:#fef3c7;color:#92400e}
.start-label{font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px;text-transform:uppercase}
.building-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.building-btn{padding:16px 8px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:center;min-height:48px}
.building-btn.selected{background:var(--accent);color:#000;border-color:var(--accent)}
.shift-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.shift-btn{padding:14px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:center;min-height:48px}
.shift-btn.selected{background:var(--accent);color:#000;border-color:var(--accent)}
.start-input{width:100%;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;margin-bottom:12px;min-height:48px}
.start-input::placeholder{color:var(--muted)}
.btn-begin{width:100%;padding:16px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;min-height:48px;margin-top:8px}
.btn-begin:disabled{opacity:0.4;cursor:not-allowed}
.walk-header{background:var(--surface);padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.walk-title{font-size:16px;font-weight:700;color:var(--accent)}
.walk-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.progress-bar{display:flex;gap:4px;margin-top:8px}
.progress-dot{width:100%;height:6px;border-radius:3px;background:var(--border);transition:background 0.3s}
.progress-dot.completed{background:var(--green)}
.progress-dot.active{background:var(--accent)}
.progress-dot.has-issue{background:var(--red)}
.btn-allok{width:100%;padding:14px;background:#065f46;color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;margin:12px 0;min-height:48px}
body.light-mode .btn-allok{background:#dcfce7;color:#166534;border:2px solid #22c55e}
.item-list{display:flex;flex-direction:column;gap:6px;padding:0 12px}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;min-height:48px}
.item-card .item-name{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.item-card .status-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.status-ok{background:rgba(34,197,94,0.2);color:var(--green)}
.status-issue{background:rgba(239,68,68,0.2);color:var(--red)}
.swipe-bg{position:absolute;top:0;bottom:0;display:none;align-items:center;padding:0 20px;font-weight:700;font-size:14px}
.swipe-bg-ok{left:0;right:0;background:#065f46;color:#22c55e;justify-content:flex-end}
.swipe-bg-issue{left:0;right:0;background:#7f1d1d;color:#ef4444}
.item-content{position:relative;z-index:1;background:var(--card);transition:transform 0.1s}
.issue-detail{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:0 0 var(--radius) var(--radius);padding:12px;margin-top:-1px}
.issue-note{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;resize:none;min-height:60px;font-family:inherit}
.photo-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;background:var(--card);border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;margin-top:8px;min-height:44px;-webkit-user-select:none;user-select:none}
.photo-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photo-thumb-wrap{position:relative;width:60px;height:60px}
.photo-thumb{width:60px;height:60px;border-radius:6px;object-fit:cover;border:2px solid var(--border);cursor:pointer}
.photo-remove{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.section-notes{padding:12px;margin-top:8px}
.section-notes label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px}
.section-notes textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;resize:none;min-height:50px;font-family:inherit}
.walk-nav{display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.btn-nav{flex:1;padding:12px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;text-align:center;border:none;min-height:48px}
.btn-nav-prev{background:var(--card);color:var(--text)}
.btn-nav-next{background:var(--accent);color:#000}
.btn-nav:disabled{opacity:0.3;cursor:not-allowed}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer}
.summary-card .sec-name{font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.summary-card .sec-details{font-size:12px;color:var(--muted);margin-top:6px;display:none}
.summary-card.expanded .sec-details{display:block}
.summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat-val{font-size:22px;font-weight:700}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.btn-submit{width:100%;padding:16px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;min-height:48px;margin-top:12px}
.recent-section{margin-top:20px}
.recent-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.recent-info{flex:1;min-width:150px}
.recent-info .r-bldg{font-weight:700;font-size:14px}
.recent-info .r-meta{font-size:11px;color:var(--muted)}
.recent-actions{display:flex;gap:6px}
.btn-edit,.btn-del{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;min-height:36px}
.btn-edit{background:var(--accent);color:#000}
.btn-del{background:var(--red);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;display:none}
.file-input-hidden{position:absolute;left:-9999px;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="header">
<button class="mode-btn" id="modeBtn" onclick="toggleMode()">&#9728;&#65039; Light</button>
<h1>SBN Daily Rounds</h1>
<div class="sub" id="headerSub">Select building to begin</div>
</div>

<!-- SCREEN 1: START -->
<div class="screen active" id="startScreen">
<div class="content">
<div class="warning-banner">&#9888;&#65039; ENSURE ALL DOORS IN PFHO&rsquo;D SPACES ARE CLOSED/LOCKED &mdash; DOORS CAN NOT BE KEPT PROPPED OPEN &#9888;&#65039;</div>

<div class="start-label">Building</div>
<div class="building-grid" id="buildingGrid"></div>

<div class="start-label">Technician</div>
<input class="start-input" type="text" id="techName" placeholder="Your name" autocomplete="off">

<div class="start-label">Shift</div>
<div class="shift-grid" id="shiftGrid"></div>

<div class="start-label">Daily Ticket URL</div>
<input class="start-input" type="text" id="ticketUrl" placeholder="Ticket URL or number (optional)" autocomplete="off">

<div class="start-label">Date</div>
<input class="start-input" type="date" id="roundDate">

<button class="btn-begin" id="btnBegin" disabled onclick="beginRounds()">BEGIN ROUNDS</button>

<div class="recent-section">
<div class="start-label">Recent Rounds</div>
<div id="recentList"><div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">Loading...</div></div>
</div>
</div>
</div>

<!-- SCREEN 2: WALKTHROUGH -->
<div class="screen" id="walkScreen">
<div class="walk-header">
<div class="walk-title" id="walkTitle"></div>
<div class="walk-desc" id="walkDesc"></div>
<div class="progress-bar" id="progressBar"></div>
</div>
<div class="content" id="walkContent"></div>
<div class="walk-nav">
<button class="btn-nav btn-nav-prev" id="btnPrev" onclick="prevSection()">&#8592; Previous</button>
<button class="btn-nav btn-nav-next" id="btnNext" onclick="nextSection()">Next &#8594;</button>
</div>
</div>

<!-- SCREEN 3: SUMMARY -->
<div class="screen" id="summaryScreen">
<div class="content" id="summaryContent"></div>
</div>

<!-- SCREEN 4: DONE -->
<div class="screen" id="doneScreen">
<div class="content" style="display:flex;align-items:center;justify-content:center;text-align:center;">
<div>
<div style="font-size:48px;margin-bottom:16px;">&#9989;</div>
<div style="font-size:20px;font-weight:700;margin-bottom:8px;">Rounds Submitted!</div>
<div style="color:var(--muted);font-size:14px;margin-bottom:20px;">Data saved. Attach the downloaded file to the SIM ticket.</div>
<button class="btn-begin" onclick="resetApp()">Start New Round</button>
</div>
</div>
</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CAMERA MODAL (outside script!) -->
<div id="cameraModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:16px;">
<div style="max-width:100%;max-height:70vh;position:relative;">
<video id="cameraVideo" autoplay playsinline muted style="max-width:100%;max-height:70vh;border-radius:12px;background:#000;"></video>
</div>

/* ===== WALKTHROUGH ===== */
function renderWalkthrough() {
  var sec = sections[currentSection];
  var secData = roundData.sections[currentSection];
  document.getElementById('walkTitle').textContent = 'Section ' + (currentSection + 1) + ' of ' + sections.length + ': ' + sec.name;
  document.getElementById('walkDesc').textContent = sec.desc;

  // Progress dots
  var pHtml = '';
  for (var p = 0; p < sections.length; p++) {
    var cls = 'progress-dot';
    if (p === currentSection) cls += ' active';
    else if (roundData.sections[p].status === 'complete') {
      cls += ' completed';
      var hasIssue = false;
      for (var q = 0; q < roundData.sections[p].items.length; q++) {
        if (roundData.sections[p].items[q].status === 'issue' || roundData.sections[p].items[q].status === 'unexpected') hasIssue = true;
      }
      if (hasIssue) cls += ' has-issue';
    }
    pHtml += '<div class="' + cls + '"></div>';
  }
  document.getElementById('progressBar').innerHTML = pHtml;

  // Content
  var html = '';
  if (sec.type === 'notes_only') {
    html += '<div style="padding:12px"><button class="btn-allok" onclick="markAllOk()">ALL OK &#9989;</button>';
    html += '<div class="section-notes"><label>Notes for ' + escHtml(sec.name) + '</label>';
    html += '<textarea id="notesOnly" placeholder="Enter notes..." oninput="updateSectionNotes(' + currentSection + ',this.value)">' + escHtml(secData.notes) + '</textarea></div></div>';
  } else {
    var okLabel = sec.type === 'exp_unexp' ? 'Expected' : 'OK';
    var issueLabel = sec.type === 'exp_unexp' ? 'Unexpected' : 'Issue';
    html += '<div style="padding:12px 12px 0"><button class="btn-allok" onclick="markAllOk()">ALL ' + okLabel.toUpperCase() + ' &#9989;</button></div>';
    html += '<div class="item-list">';
    for (var idx = 0; idx < sec.cols.length; idx++) {
      var item = secData.items[idx];
      var statusCls = '';
      var statusText = '';
      if (item.status === 'ok' || item.status === 'expected') { statusCls = 'status-ok'; statusText = okLabel; }
      else if (item.status === 'issue' || item.status === 'unexpected') { statusCls = 'status-issue'; statusText = issueLabel; }

      html += '<div class="item-card" id="card-' + idx + '">';
      html += '<div class="swipe-bg swipe-bg-ok">&#10003; ' + okLabel + '</div>';
      html += '<div class="swipe-bg swipe-bg-issue">' + issueLabel + ' &#10007;</div>';
      html += '<div class="item-content"><div class="item-name"><span>' + escHtml(sec.cols[idx]) + '</span>';
      if (statusText) html += '<span class="status-badge ' + statusCls + '">' + statusText + '</span>';
      html += '</div></div></div>';

      if (item.status === 'issue' || item.status === 'unexpected') {
        html += '<div class="issue-detail">';
        html += '<textarea class="issue-note" placeholder="Describe the issue..." oninput="updateItemNote(' + currentSection + ',' + idx + ',this.value)">' + escHtml(item.note) + '</textarea>';
        var photoKey = currentSection + '-' + idx;
        var photos = photoStore[photoKey] || [];
        if (photos.length < 3) {
          html += '<button type="button" class="photo-btn" onclick="openCamera(' + currentSection + ',' + idx + ')">&#128247; Photo</button>';
          html += '<input type="file" id="fileInp-' + currentSection + '-' + idx + '" class="file-input-hidden" accept="image/*" onchange="handlePhoto(this,' + currentSection + ',' + idx + ')">';
        }
        if (photos.length > 0) {
          html += '<div class="photo-thumbs">';
          for (var pi = 0; pi < photos.length; pi++) {
            html += '<div class="photo-thumb-wrap"><img class="photo-thumb" src="' + photos[pi] + '" onclick="previewPhoto(' + "'" + photoKey + "'" + ',' + pi + ')"><button class="photo-remove" onclick="removePhoto(' + "'" + photoKey + "'" + ',' + pi + ')">&#10005;</button></div>';

          html += '</div>';

  }

}

/* ===== SWIPE ===== */
function attachSwipe(card, sIdx, iIdx, type) {
  if (!card) return;
  var startX = 0, startY = 0, swiping = false, scrolling = false;
  var content = card.querySelector('.item-content');

  card.addEventListener('touchstart', function(e) {
    var t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    swiping = false;
    scrolling = false;
    content.style.transition = 'none';
  }, {passive: true});

  card.addEventListener('touchmove', function(e) {
    if (scrolling) return;
    var t = e.touches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    if (!swiping && Math.abs(dy) > Math.abs(dx)) { scrolling = true; return; }
    swiping = true;
    var okBg = card.querySelector('.swipe-bg-ok');
    var issueBg = card.querySelector('.swipe-bg-issue');
    if (dx > 10) { okBg.style.display = 'flex'; issueBg.style.display = 'none'; }
    else if (dx < -10) { issueBg.style.display = 'flex'; okBg.style.display = 'none'; }
    else { okBg.style.display = 'none'; issueBg.style.display = 'none'; }
    content.style.transform = 'translateX(' + dx + 'px)';
  }, {passive: true});

  card.addEventListener('touchend', function(e) {
    if (scrolling) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    content.style.transition = 'transform 0.2s ease';
    if (dx > 80) {
      markItem(sIdx, iIdx, type === 'exp_unexp' ? 'expected' : 'ok');
    } else if (dx < -80) {
      markItem(sIdx, iIdx, type === 'exp_unexp' ? 'unexpected' : 'issue');
    }
    content.style.transform = 'translateX(0)';
    // Hide swipe backgrounds after release
    card.querySelector('.swipe-bg-ok').style.display = 'none';
    card.querySelector('.swipe-bg-issue').style.display = 'none';
  });

  // Also support click/tap to toggle
  card.addEventListener('click', function(e) {
    if (swiping) return;
    var item = roundData.sections[sIdx].items[iIdx];
    if (item.status) {
      item.status = '';
      item.note = '';
      renderWalkthrough();
    }
  });
}

function markItem(sIdx, iIdx, status) {
  roundData.sections[sIdx].items[iIdx].status = status;
  checkSectionComplete(sIdx);
  renderWalkthrough();
  setTimeout(function() { updateNavButtons(); }, 100);
}

function markAllOk() {
  var sec = sections[currentSection];
  var secData = roundData.sections[currentSection];
  var okStatus = sec.type === 'exp_unexp' ? 'expected' : 'ok';
  for (var i = 0; i < secData.items.length; i++) {
    secData.items[i].status = okStatus;
  }
  secData.allOk = true;
  secData.status = 'complete';
  secData.completedBy = roundData.technician;
  secData.completedAt = Date.now();
  if (currentSection < sections.length - 1) {
    currentSection++;
  }
  renderWalkthrough();
}

function updateItemNote(sIdx, iIdx, val) {
  roundData.sections[sIdx].items[iIdx].note = val;
  updateNavButtons();
}

function updateSectionNotes(sIdx, val) {
  roundData.sections[sIdx].notes = val;
}

function checkSectionComplete(sIdx) {
  var secData = roundData.sections[sIdx];
  var allDone = true;
  var allOk = true;
  for (var i = 0; i < secData.items.length; i++) {
    if (!secData.items[i].status) allDone = false;
    if (secData.items[i].status === 'issue' || secData.items[i].status === 'unexpected') allOk = false;
  }
  if (allDone || sections[sIdx].type === 'notes_only') {
    secData.status = 'complete';
    secData.allOk = allOk;
    secData.completedBy = roundData.technician;
    secData.completedAt = Date.now();
  }
}

function updateNavButtons() {
  var secData = roundData.sections[currentSection];
  document.getElementById('btnPrev').disabled = currentSection === 0;
  var allMarked = true;
  var allNotesOk = true;
  for (var i = 0; i < secData.items.length; i++) {
    if (!secData.items[i].status) allMarked = false;
    if ((secData.items[i].status === 'issue' || secData.items[i].status === 'unexpected') && !secData.items[i].note) allNotesOk = false;
  }
  var sec = sections[currentSection];
  var canAdvance = sec.type === 'notes_only' || (allMarked && allNotesOk);
  var btnNext = document.getElementById('btnNext');
  btnNext.disabled = !canAdvance;
  btnNext.textContent = currentSection === sections.length - 1 ? 'Review Summary' : 'Next \u2192';
}

function prevSection() {
  if (currentSection > 0) { currentSection--; renderWalkthrough(); }
}

function nextSection() {
  if (currentSection < sections.length - 1) {
    checkSectionComplete(currentSection);
    currentSection++;
    renderWalkthrough();
    document.getElementById('walkContent').scrollTop = 0;
  } else {
    checkSectionComplete(currentSection);
    showSummary();
  }
}

/* ===== PHOTOS ===== */
function handlePhoto(input, sIdx, iIdx) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800;
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.8);
      var key = sIdx + '-' + iIdx;
      if (!photoStore[key]) photoStore[key] = [];
      if (photoStore[key].length < 3) {
        photoStore[key].push(compressed);
        roundData.sections[sIdx].items[iIdx].photos = photoStore[key].length;
        renderWalkthrough();
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewPhoto(key, idx) {
  var photos = photoStore[key];
  if (photos && photos[idx]) {
    document.getElementById('photoPreviewImg').src = photos[idx];
    document.getElementById('photoPreviewModal').style.display = 'flex';
  }
}

function removePhoto(key, idx) {
  if (photoStore[key]) {
    photoStore[key].splice(idx, 1);
    var parts = key.split('-');
    roundData.sections[parseInt(parts[0])].items[parseInt(parts[1])].photos = photoStore[key].length;
    renderWalkthrough();
  }
}

  showScreen('summaryScreen');
  var totalItems = 0, okCount = 0, issueCount = 0, photoCount = 0;
  var html = '<div style="padding:12px"><h2 style="color:var(--accent);margin-bottom:12px;">Round Summary</h2>';
  html += '<div class="summary-stats">';

  roundData.sections.forEach(function(sec) {
    sec.items.forEach(function(item) {
      totalItems++;
      if (item.status === 'ok' || item.status === 'expected') okCount++;
      if (item.status === 'issue' || item.status === 'unexpected') issueCount++;
      photoCount += (item.photos || 0);
    });
  });

  html += '<div class="stat-card"><div class="stat-val" style="color:var(--green)">' + okCount + '</div><div class="stat-lbl">OK</div></div>';
  html += '<div class="stat-card"><div class="stat-val" style="color:var(--red)">' + issueCount + '</div><div class="stat-lbl">Issues</div></div>';
  html += '<div class="stat-card"><div class="stat-val">' + totalItems + '</div><div class="stat-lbl">Total Items</div></div>';
  html += '<div class="stat-card"><div class="stat-val">' + photoCount + '</div><div class="stat-lbl">Photos</div></div>';
  html += '</div>';

  roundData.sections.forEach(function(sec, sIdx) {
    var secIssues = 0;
    sec.items.forEach(function(it) { if (it.status === 'issue' || it.status === 'unexpected') secIssues++; });
    var icon = secIssues > 0 ? '<span style="color:var(--red)">&#9888;&#65039; ' + secIssues + ' issue' + (secIssues > 1 ? 's' : '') + '</span>' : '<span style="color:var(--green)">&#9989; All OK</span>';
    html += '<div class="summary-card" onclick="this.classList.toggle(\'expanded\')">';
    html += '<div class="sec-name"><span>' + sec.name + '</span>' + icon + '</div>';
    html += '<div class="sec-details">';
    if (sec.completedBy) html += '<div style="font-size:11px;color:var(--muted)">Completed by ' + sec.completedBy + '</div>';
    sec.items.forEach(function(it) {
      if (it.status === 'issue' || it.status === 'unexpected') {
        html += '<div style="color:var(--red);margin-top:4px">&#8226; ' + it.name + ': ' + (it.note || 'No note') + '</div>';
      }
    });
    if (sec.notes) html += '<div style="color:var(--muted);margin-top:4px;font-style:italic">Notes: ' + sec.notes + '</div>';
    html += '</div></div>';
  });

  html += '<button class="btn-submit" onclick="submitRounds()">SUBMIT ROUNDS</button>';
  html += '<button class="btn-nav btn-nav-prev" style="width:100%;margin-top:8px" onclick="showScreen(\'walkScreen\');renderWalkthrough()">&#8592; Back to Walkthrough</button>';
  html += '</div>';
  document.getElementById('summaryContent').innerHTML = html;
}

/* ===== SUBMIT ===== */
function submitRounds() {
  try {
  roundData.endTime = Date.now();
  roundData.status = 'completed';
  roundData.lastModified = Date.now();

  var excelHtml = generateExcel();
  var baseName = roundData.building + '_Rounds_' + roundData.date + '_' + roundData.technician.replace(/[^a-zA-Z0-9]/g,'');
  var hasPhotos = false;
  var keys = Object.keys(photoStore);
  for (var i = 0; i < keys.length; i++) { if (photoStore[keys[i]].length > 0) { hasPhotos = true; break; } }

  if (hasPhotos && typeof JSZip !== 'undefined') {
    var zip = new JSZip();
    zip.file(baseName + '.xls', excelHtml);
    var folder = zip.folder('photos');
    keys.forEach(function(key) {
      photoStore[key].forEach(function(dataUrl, pi) {
        var parts = key.split('-');
        var secName = sections[parseInt(parts[0])].name.replace(/[^a-zA-Z0-9]/g,'_').substring(0,15);
        var itemName = sections[parseInt(parts[0])].cols[parseInt(parts[1])] || 'item';
        itemName = itemName.replace(/[^a-zA-Z0-9]/g,'_').substring(0,15);
        var b64 = dataUrl.split(',')[1];
        folder.file(secName + '_' + itemName + '_' + (pi+1) + '.jpg', b64, {base64: true});
      });
    });
    zip.generateAsync({type:'blob'}).then(function(blob) {
      downloadBlob(blob, baseName + '.zip');
      afterSubmit(baseName);
    });
  } else {
    var blob = new Blob([excelHtml], {type:'application/vnd.ms-excel'});
    downloadBlob(blob, baseName + '.xls');
    afterSubmit(baseName);
  }
  } catch(err) { alert('Submit error: ' + err.message); }
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function afterSubmit(baseName) {
  // Save to Firebase
  var fbKey = 'rounds/' + roundData.building + '/' + roundData.date + '/' + Date.now();
  if (isEditing && editKey) fbKey = editKey;
  saveToFirebase(roundData, fbKey);

  // Open ticket
  var ticketUrl = roundData.ticketUrl;
  if (ticketUrl) {
    if (!/^https?:\/\//.test(ticketUrl)) {
      ticketUrl = ticketUrl.replace(/^tt\//, '');
      ticketUrl = 'https://t.corp.amazon.com/' + ticketUrl;
    }
    window.open(ticketUrl, '_blank');
  }

  // Email
  var totalItems = 0, okCount = 0, issueCount = 0;
  roundData.sections.forEach(function(sec) {
    sec.items.forEach(function(item) {
      totalItems++;
      if (item.status === 'ok' || item.status === 'expected') okCount++;
      if (item.status === 'issue' || item.status === 'unexpected') issueCount++;
    });
  });
  var body = roundData.building + ' Daily Rounds\n';
  body += 'Date: ' + roundData.date + '\n';
  body += 'Technician: ' + roundData.technician + '\n';
  body += 'Shift: ' + roundData.shift + '\n\n';
  body += 'Summary: ' + okCount + '/' + totalItems + ' OK, ' + issueCount + ' issues\n\n';
  if (issueCount > 0) {
    body += 'ISSUES:\n';
    roundData.sections.forEach(function(sec) {
      sec.items.forEach(function(item) {
        if (item.status === 'issue' || item.status === 'unexpected') {
          body += '- ' + sec.name + ' > ' + item.name + ': ' + (item.note || '') + '\n';
        }
      });
    });
  }
  if (ticketUrl) body += '\nDaily Ticket: ' + ticketUrl + '\n';
  body += '\n(File attached separately)';
  var mailtoUrl = 'mailto:SBN207@groups.amazon.com?subject=' + encodeURIComponent(roundData.building + ' Daily Rounds - ' + roundData.date + ' - ' + roundData.shift) + '&body=' + encodeURIComponent(body);
  try { window.location.href = mailtoUrl; } catch(e) {}

  showScreen('doneScreen');
  showToast('Submitted! Attach file to SIM ticket.');
}

/* ===== EXCEL EXPORT ===== */
function generateExcel() {
  var h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">';
  h += '<head><meta charset="UTF-8"><style>';
  h += 'table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11px;width:100%}';
  h += 'td,th{border:1px solid #d5d9d9;padding:6px 10px}';
  h += '.title{background:#232f3e;color:#ff9900;font-size:16px;font-weight:bold;text-align:center;border:none}';
  h += '.info-label{background:#f4f4f4;font-weight:bold;border:none}';
  h += '.info-value{border:none}';
  h += '.section-title{background:#ff9900;color:#232f3e;font-weight:bold;font-size:12px}';
  h += '.col-header{background:#232f3e;color:#fff;font-weight:bold;text-align:center;font-size:10px}';
  h += '.ok{background:#dcfce7;color:#166534;text-align:center}';
  h += '.issue{background:#fef2f2;color:#991b1b;font-weight:bold;text-align:center}';
  h += '.note-cell{background:#fffbeb;font-style:italic}';
  h += '.summary-hdr{background:#ff9900;color:#232f3e;font-weight:bold}';
  h += '.summary{background:#fff8ec}';
  h += '</style></head><body>';
  h += '<table>';
  h += '<tr><td class="title" colspan="4">SBN DAILY ROUNDS REPORT</td></tr>';
  h += '<tr><td class="info-label">Building</td><td class="info-value">' + roundData.building + '</td><td class="info-label">Date</td><td class="info-value">' + roundData.date + '</td></tr>';
  h += '<tr><td class="info-label">Technician</td><td class="info-value">' + roundData.technician + '</td><td class="info-label">Shift</td><td class="info-value">' + roundData.shift + '</td></tr>';
  if (roundData.ticketUrl) h += '<tr><td class="info-label">Daily Ticket</td><td class="info-value" colspan="3"><a href="' + roundData.ticketUrl + '">' + roundData.ticketUrl + '</a></td></tr>';
  h += '<tr><td colspan="4" style="border:none;height:10px"></td></tr>';

  roundData.sections.forEach(function(sec, sIdx) {
    h += '<tr><td class="section-title" colspan="4">' + sec.name + '</td></tr>';
    if (sec.completedBy) h += '<tr><td colspan="4" style="font-size:10px;color:#166534;background:#f0fdf4;font-style:italic">Completed by ' + sec.completedBy + '</td></tr>';
    sec.items.forEach(function(item) {
      var cls = '';
      if (item.status === 'ok' || item.status === 'expected') cls = 'ok';
      else if (item.status === 'issue' || item.status === 'unexpected') cls = 'issue';
      h += '<tr><td>' + item.name + '</td><td class="' + cls + '">' + (item.status || '-') + '</td>';
      h += '<td class="' + (item.note ? 'note-cell' : '') + '">' + (item.note || '') + '</td>';
      h += '<td>' + (item.photos > 0 ? item.photos + ' photo(s)' : '') + '</td></tr>';
    });
    if (sec.notes) h += '<tr><td colspan="4" class="note-cell">Notes: ' + sec.notes + '</td></tr>';
  });

  var totalItems = 0, okCount = 0, issueCount = 0;
  roundData.sections.forEach(function(sec) {
    sec.items.forEach(function(item) {
      totalItems++;
      if (item.status === 'ok' || item.status === 'expected') okCount++;
      if (item.status === 'issue' || item.status === 'unexpected') issueCount++;
    });
  });
  h += '<tr><td colspan="4" style="border:none;height:10px"></td></tr>';
  h += '<tr><td class="summary-hdr" colspan="4">SUMMARY</td></tr>';
  h += '<tr><td class="summary">Total</td><td class="summary">' + totalItems + '</td><td class="summary">OK</td><td class="summary">' + okCount + '</td></tr>';
  h += '<tr><td class="summary">Issues</td><td class="summary" style="' + (issueCount > 0 ? 'color:#991b1b;font-weight:bold' : '') + '">' + issueCount + '</td><td></td><td></td></tr>';
  h += '</table></body></html>';
  return h;
}

/* ===== RECENT ROUNDS (Firebase) ===== */
function loadRecentRounds() {
  if (!db) { document.getElementById('recentList').innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px;">Offline — no recent rounds available</div>'; return; }
  var buildings = ['SBN201','SBN202','SBN203','SBN204','SBN205','SBN206','SBN207','SBN208','SBN209'];
  var allRounds = [];
  var pending = 0;
  var today = new Date();

  for (var d = 0; d < 7; d++) {
    var dt = new Date(today);
    dt.setDate(dt.getDate() - d);
    var dateStr = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
    for (var b = 0; b < buildings.length; b++) {
      pending++;
      (function(bldg, ds) {
        db.ref('rounds/' + bldg + '/' + ds).once('value', function(snap) {
          var val = snap.val();
          if (val) {
            var keys = Object.keys(val);
            for (var k = 0; k < keys.length; k++) {
              var r = val[keys[k]];
              r._fbKey = 'rounds/' + bldg + '/' + ds + '/' + keys[k];
              allRounds.push(r);
            }
          }
          pending--;
          if (pending === 0) renderRecentRounds(allRounds);
        }, function() { pending--; if (pending === 0) renderRecentRounds(allRounds); });
      })(buildings[b], dateStr);
    }
  }
}

function renderRecentRounds(rounds) {
  if (rounds.length === 0) {
    document.getElementById('recentList').innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px;">No recent rounds found</div>';
    return;
  }
  rounds.sort(function(a, b) { return (b.startTime || 0) - (a.startTime || 0); });
  var html = '';
  for (var i = 0; i < Math.min(rounds.length, 20); i++) {
    var r = rounds[i];
    var statusBadge = r.status === 'completed' ? '<span style="color:var(--green)">&#9989; Complete</span>' : '<span style="color:var(--accent)">&#128260; In Progress</span>';
    html += '<div class="recent-card">';
    html += '<div class="recent-info"><div class="r-bldg">' + (r.building || '?') + ' &mdash; ' + (r.date || '') + '</div>';
    html += '<div class="r-meta">' + (r.technician || '') + ' | ' + (r.shift || '') + ' | ' + statusBadge + '</div></div>';
    html += '<div class="recent-actions">';
    html += '<button class="btn-edit" onclick="editRound(\'' + (r._fbKey || '').replace(/'/g, "\\'") + '\')">&#9999;&#65039; Edit</button>';
    html += '<button class="btn-del" onclick="deleteRound(\'' + (r._fbKey || '').replace(/'/g, "\\'") + '\')">&#128465; Delete</button>';
    html += '</div></div>';
  }
  document.getElementById('recentList').innerHTML = html;
}

function editRound(fbKey) {
  if (!db) { showToast('Cannot edit while offline'); return; }
  db.ref(fbKey).once('value', function(snap) {
    var data = snap.val();
    if (!data) { showToast('Round not found'); return; }
    roundData = data;
    isEditing = true;
    editKey = fbKey;
    currentSection = 0;
    photoStore = {};
    showScreen('walkScreen');
    renderWalkthrough();
  });
}

function deleteRound(fbKey) {
  if (!confirm('Delete this round? This cannot be undone.')) return;
  deleteFromFirebase(fbKey);
  showToast('Round deleted');
  setTimeout(loadRecentRounds, 500);
}

function resetApp() {
  roundData = null;
  photoStore = {};
  currentSection = 0;
  isEditing = false;
  editKey = null;
  showScreen('startScreen');
  loadRecentRounds();
}

/* ===== DARK/LIGHT MODE ===== */
function toggleMode() {
  var btn = document.getElementById('modeBtn');
  if (document.body.classList.contains('light-mode')) {
    document.body.classList.remove('light-mode');
    btn.innerHTML = '&#9728;&#65039; Light';
    try { localStorage.setItem('sbn-rounds-theme', 'dark'); } catch(e) {}
  } else {
    document.body.classList.add('light-mode');
    btn.innerHTML = '&#127769; Dark';
    try { localStorage.setItem('sbn-rounds-theme', 'light'); } catch(e) {}
  }
}

function loadTheme() {
  try {
    if (localStorage.getItem('sbn-rounds-theme') === 'light') {
      document.body.classList.add('light-mode');
      document.getElementById('modeBtn').innerHTML = '&#127769; Dark';
    }
  } catch(e) {}
}

/* ===== CAMERA MODAL (for Windows tablets) ===== */
document.getElementById('btnCapture').addEventListener('click', function() {
  var video = document.getElementById('cameraVideo');
  var canvas = document.getElementById('cameraCanvas');
  var maxW = 800;
  var w = video.videoWidth, h = video.videoHeight;
  if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  var compressed = canvas.toDataURL('image/jpeg', 0.8);
  var key = cameraSIdx + '-' + cameraIIdx;
  if (!photoStore[key]) photoStore[key] = [];
  if (photoStore[key].length < 3) {
    photoStore[key].push(compressed);
    roundData.sections[cameraSIdx].items[cameraIIdx].photos = photoStore[key].length;
    renderWalkthrough();
  }
  closeCameraModal();
});

document.getElementById('btnCamCancel').addEventListener('click', closeCameraModal);
document.getElementById('btnClosePreview').addEventListener('click', function() {
  document.getElementById('photoPreviewModal').style.display = 'none';
});

function closeCameraModal() {
  if (cameraStream) {
    var tracks = cameraStream.getTracks();
    for (var i = 0; i < tracks.length; i++) tracks[i].stop();
    cameraStream = null;
  }
  document.getElementById('cameraModal').style.display = 'none';
}

/* ===== SERVICE WORKER ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}

/* ===== INIT ===== */
function waitForFirebase() {
  if (typeof firebase !== 'undefined' && firebase.initializeApp) {
    initFirebase();
    loadRecentRounds();
  } else {
    setTimeout(waitForFirebase, 100);
  }
}

loadTheme();
initStartScreen();
waitForFirebase();


/* ===== CAMERA FOR WINDOWS TABLETS ===== */
var cameraStream = null;
var camSIdx = -1;
var camIIdx = -1;
var camFacing = 'environment'; // Default to back camera

function startCameraStream() {
  // Stop any existing stream first
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(track) { track.stop(); });
    cameraStream = null;
  }
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: {exact: camFacing}, width: {ideal: 1280}, height: {ideal: 720} }
  }).catch(function() {
    // exact facingMode failed — try ideal (some devices don't support exact)
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: {ideal: camFacing}, width: {ideal: 1280}, height: {ideal: 720} }
    });
  }).then(function(stream) {
    cameraStream = stream;
    var video = document.getElementById('cameraVideo');
    video.srcObject = stream;
    video.onloadedmetadata = function() { video.play(); };
    return stream;
  });
}

function openCamera(sIdx, iIdx) {
  camSIdx = sIdx;
  camIIdx = iIdx;
  camFacing = 'environment'; // Always start with back camera
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    startCameraStream().then(function() {
      document.getElementById('cameraModal').style.display = 'flex';
    }).catch(function(err) {
      // Camera denied or not available — fall back to file picker
      var inp = document.getElementById('fileInp-' + sIdx + '-' + iIdx);
      if (inp) inp.click();
    });
  } else {
    var inp = document.getElementById('fileInp-' + sIdx + '-' + iIdx);
    if (inp) inp.click();
  }
}

function flipCamera() {
  camFacing = (camFacing === 'environment') ? 'user' : 'environment';
  startCameraStream().catch(function() {
    // If flip fails, revert
    camFacing = (camFacing === 'environment') ? 'user' : 'environment';
    startCameraStream();
  });
}

function capturePhoto() {
  var video = document.getElementById('cameraVideo');
  var canvas = document.getElementById('cameraCanvas');
  var maxW = 800;
  var w = video.videoWidth;
  var h = video.videoHeight;
  if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  var compressed = canvas.toDataURL('image/jpeg', 0.8);
  var key = camSIdx + '-' + camIIdx;
  if (!photoStore[key]) photoStore[key] = [];
  if (photoStore[key].length < 3) {
    photoStore[key].push(compressed);
    roundData.sections[camSIdx].items[camIIdx].photos = photoStore[key].length;
    renderWalkthrough();
    syncToFirebase();
  }
  closeCameraModal();
}

function closeCameraModal() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(track) { track.stop(); });
    cameraStream = null;
  }
  var video = document.getElementById('cameraVideo');
  video.srcObject = null;
  document.getElementById('cameraModal').style.display = 'none';
}

// Wire up camera modal buttons (using addEventListener to avoid inline onclick issues)
document.getElementById('btnCapture').addEventListener('click', capturePhoto);
document.getElementById('btnCamCancel').addEventListener('click', closeCameraModal);
document.getElementById('btnFlipCam').addEventListener('click', flipCamera);

</script>
